[project]
name = "langgraph-agent-template"
version = "0.0.0"
description = "Opinionated personal starter for LangGraph agent projects."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.3.0,<2.0.0",
    "langchain-deepseek>=1.1.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.1,<4.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
]

[project.scripts]
agent-db-setup = "agent.persistence:main"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]

[dependency-groups]
dev = [
    "langgraph-cli>=0.4.14,<1.0.0",
    "ruff>=0.16.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["E501", "D415", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"
