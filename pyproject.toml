[project]
name = "langgraph-agent-template"
version = "0.0.0"
description = "Provider-neutral structure template for LangGraph agent projects."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.3.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.14",
]
